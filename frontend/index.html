<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Quiz Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Python Quiz Game</h1>
    <p>Test your Python knowledge!</p>
    <form id="startForm">
      <input id="playerName" type="text" placeholder="Enter your name" required maxlength="50">
      <button type="submit">Start Quiz</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
